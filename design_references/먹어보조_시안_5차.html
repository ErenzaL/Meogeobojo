<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>먹어보조</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,300..400,0..1,0&display=block">
<style>
/* 5차 디자인: 회색에 가까운 따뜻한 중립색 + 주황 강조색 하나. 강조색은 주요 버튼과 추천 카드에만 써요.
   점선 = 추정·미확인. 걸어가는 시간처럼 계산한 값과 등록되지 않은 정보는 점선으로 표시해요. */
:root{
  --bg:#F6F5F3; --card:#FFFFFF; --raised:#EFEDE9;
  --text:#1C1A17; --text-2:#57524B; --muted:#6F6962;
  --line:rgb(28 26 23 / .09); --line-2:rgb(28 26 23 / .17);
  --accent:#C2410C; --accent-ink:#9A3412; --on-accent:#FFFFFF; --accent-soft:#FBEEE7;
  --ok:#15803D; --warn:#B45309; --error:#C62828; --star:#B7791F;
  --ink:#1C1A17; --on-ink:#FFFFFF;
  --float:0 8px 24px rgb(28 26 23 / .08),0 1px 2px rgb(28 26 23 / .06);
  --stage-bg:#E9E7E3; --frame:#1C1A17;
  --peach:#F1EDE7; --plate:#FFFFFF; --food-a:#FFB54D; --food-rim:#E46526; --food-g:#6A9A3E; --food-l:#FFCA80;
  --map-bg:#EFEDE9; --map-road:#FFFFFF; --map-block:#E5E2DD; --map-park:#E1E7DA; --map-bld:#A8A097;
  --scrim:rgb(28 26 23 / .4);
  --font:"Pretendard Variable","Pretendard","Noto Sans SC",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","PingFang SC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  /* 4차 화면 코드가 쓰던 이름 → 5차 값 */
  --primary:var(--accent-ink); --on-primary:var(--on-accent); --grad:var(--accent); --grad-soft:var(--raised);
  --pc:var(--accent-soft); --on-pc:var(--accent-ink); --coral:var(--accent);
  --sc:var(--ink); --on-sc:var(--on-ink); --tc:var(--raised); --on-tc:var(--text);
  --surface:var(--bg); --scl:var(--card); --scc:var(--card); --sch:var(--raised); --schh:var(--raised);
  --on-surface:var(--text); --osv:var(--muted); --outline:var(--line-2); --ov:var(--line);
  --inv-s:var(--ink); --inv-on:var(--on-ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151413; --card:#1C1B19; --raised:#272522;
  --text:#EFEBE4; --text-2:#B3ADA4; --muted:#938D84;
  --line:rgb(239 235 228 / .09); --line-2:rgb(239 235 228 / .18);
  --accent:#EE7A45; --accent-ink:#F4A177; --on-accent:#1C1A17; --accent-soft:rgb(238 122 69 / .14);
  --ok:#5FC28A; --warn:#E8A852; --error:#F07D72; --star:#E2B04A;
  --ink:#EFEBE4; --on-ink:#151413; --float:0 8px 24px rgb(0 0 0 / .45);
  --stage-bg:#0E0D0C; --frame:#2A2825;
  --peach:#2A2724; --plate:#2E2A26; --food-a:#E89A3C; --food-rim:#C84300; --food-g:#7FA85A; --food-l:#D9A85A;
  --map-bg:#1E1C1A; --map-road:#2A2825; --map-block:#232120; --map-park:#222821; --map-bld:#6E675F;
  --scrim:rgb(0 0 0 / .55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151413; --card:#1C1B19; --raised:#272522;
  --text:#EFEBE4; --text-2:#B3ADA4; --muted:#938D84;
  --line:rgb(239 235 228 / .09); --line-2:rgb(239 235 228 / .18);
  --accent:#EE7A45; --accent-ink:#F4A177; --on-accent:#1C1A17; --accent-soft:rgb(238 122 69 / .14);
  --ok:#5FC28A; --warn:#E8A852; --error:#F07D72; --star:#E2B04A;
  --ink:#EFEBE4; --on-ink:#151413; --float:0 8px 24px rgb(0 0 0 / .45);
  --stage-bg:#0E0D0C; --frame:#2A2825;
  --peach:#2A2724; --plate:#2E2A26; --food-a:#E89A3C; --food-rim:#C84300; --food-g:#7FA85A; --food-l:#D9A85A;
  --map-bg:#1E1C1A; --map-road:#2A2825; --map-block:#232120; --map-park:#222821; --map-bld:#6E675F;
  --scrim:rgb(0 0 0 / .55); color-scheme:dark;
}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{background:var(--stage-bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:300;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 300,"GRAD" 0,"opsz" 20;width:1em;overflow:hidden;flex:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 300,"GRAD" 0,"opsz" 20}
.ms.sm{font-size:18px}

/* stage */
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px}
.framed #stage{padding-inline:16px}
#device{position:relative;background:var(--bg);overflow:hidden;width:100%;height:100%}
.framed #device{width:412px;height:min(892px,calc(100% - 40px));border-radius:44px;border:10px solid var(--frame);box-shadow:0 24px 48px -24px rgb(0 0 0 / .3)}
#stage-side{display:none;max-width:300px;flex-direction:column;gap:20px}
.framed #stage-side{display:flex}
.side-brand{font-size:28px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px}
.side-brand::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.side-copy{color:var(--text-2);line-height:1.6;font-size:14px;text-wrap:pretty;margin:0}
.side-note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;height:36px;width:max-content;background:var(--card)}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:13px;font-weight:500;color:var(--text-2);transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
@media (max-width:1000px){#stage-side{display:none!important}}

/* app shell */
#app{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.screen-in{animation:fadeup .32s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pad{padding-inline:16px}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.center{text-align:center;align-items:center}
.brand{font-size:19px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.brand::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.h1{font-size:26px;font-weight:600;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.h2{font-size:18px;font-weight:600;line-height:1.35}
.h3{font-size:15px;font-weight:500;line-height:1.4}
.t-body{font-size:15px;line-height:1.55}
.t-sm{font-size:13px;color:var(--text-2);line-height:1.5}
.t-xs{font-size:12px;color:var(--muted);line-height:1.5}
.eyebrow{font-size:12px;font-weight:500;color:var(--text-2)}
.link{font-size:13px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:4px;padding:6px 4px;border-radius:8px;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp8{height:8px}.sp16{height:16px}
.st{position:relative;isolation:isolate;transition:transform .14s var(--ease)}
.st::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity .15s var(--ease);pointer-events:none}
.st:hover::after{opacity:.05}.st:active::after{opacity:.1}.st:active{transform:scale(.98)}
.sec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.sec-h b{font-size:13px;font-weight:600;color:var(--text)}

/* 추정·미확인 표시: 확인됨 = 채운 점, 없음 = 빈 원, 확인 안 됨·추정 = 점선 */
.tri,.fit{display:inline-flex;align-items:center;gap:8px;color:var(--text);white-space:nowrap}
.tri{font-size:14px;min-height:24px}
.tri::before,.fit::before{content:"";width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}
.tri.n,.fit.n,.tri.u,.fit.u{color:var(--muted)}
.tri.n::before,.fit.n::before{background:none;border:1.5px solid currentColor}
.tri.u::before,.fit.u::before{background:none;border:2px dotted currentColor}
.fit{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:500;gap:6px}
.est{text-decoration:underline dashed;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 50%,transparent)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px;flex-wrap:nowrap}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap;flex:none;color:var(--text);background:var(--card);transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.chip .ms{font-size:18px;color:var(--muted)}
.chip.sel{background:var(--ink);color:var(--on-ink);border-color:var(--ink);padding-left:8px}
.chip.sel .ms{color:inherit}
.chip.static{cursor:default}
.chip.cond{background:var(--raised);border-color:transparent;padding-right:6px}
.chip.soft{border-style:dashed;padding-right:6px}
.chip.origin{padding-left:8px;padding-right:6px}
.chip.origin .ms:first-child{color:var(--accent)}
.chip.ht{color:var(--text-2)}
.chip.ht.sel{color:var(--on-ink)}
.price{font-size:14px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.price.lg{font-size:15px}
.badge-n{height:20px;min-width:20px;padding:0 6px;border-radius:6px;background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.status.open{color:var(--ok)}
.status.soon{color:var(--warn)}
.status.warn{color:var(--error)}

/* buttons */
.btn{height:48px;border-radius:12px;padding:0 20px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .14s var(--ease)}
.btn .ms{font-size:18px}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px;gap:6px}
.btn.filled{background:var(--accent);color:var(--on-accent)}
.btn.tonal{background:var(--raised);color:var(--text)}
.btn.outlined{border:1px solid var(--line-2);color:var(--text);background:var(--card)}
.btn.text{color:var(--accent-ink);padding:0 12px}
.btn.danger{background:var(--error);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--text-2);flex:none}
.ibtn.tonal{background:var(--raised);color:var(--text)}
.ibtn.filled{background:var(--accent);color:var(--on-accent)}
.ibtn.on{color:var(--accent)}
a.btn{text-decoration:none}

/* fields */
.search{height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line-2);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted);width:100%;text-align:left}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--text);font-size:15px}
.search span.ph{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{position:relative;display:flex;flex-direction:column;gap:4px}
.field label.fl{position:absolute;left:14px;top:8px;font-size:12px;color:var(--muted);pointer-events:none}
.field select{height:52px;border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:20px 40px 6px 14px;font-size:15px;appearance:none;-webkit-appearance:none;width:100%}
.field .dd{position:absolute;right:12px;top:16px;pointer-events:none;color:var(--muted)}
.out{border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;background:var(--card);width:100%;font-size:15px;line-height:1.5;resize:vertical}
.out:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
select.out{height:48px;padding-block:0}
.olabel{font-size:12px;color:var(--text-2);margin-bottom:4px;display:block}
.err-t{font-size:12px;color:var(--error);min-height:16px}
.cnt{font-size:12px;color:var(--muted);text-align:right}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.switch{width:44px;height:26px;border-radius:13px;background:var(--raised);border:1px solid var(--line-2);position:relative;flex:none;transition:background-color .18s var(--ease),border-color .18s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .18s var(--ease)}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* list items: 한 장의 카드 안에서 줄로 나눠요 */
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;background:transparent;text-align:left;width:100%;color:var(--text)}
.li.solo{border-radius:16px;background:var(--card);border:1px solid var(--line)}
.li.hl{background:var(--accent-soft)}
.li.high{background:var(--raised)}
.li.dim .tt{color:var(--muted)}
.lead{width:36px;height:36px;border-radius:10px;background:var(--raised);color:var(--text-2);display:grid;place-items:center;flex:none}
.li.hl .lead{background:var(--card)}
.li .tt{font-size:15px;font-weight:500;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .stt{font-size:13px;color:var(--text-2);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .stt.wrap{white-space:normal;overflow:visible}
.li .stt .status{font-size:12px}
.li .trail{display:flex;align-items:center;gap:8px;color:var(--muted);flex:none}
.thumb{border-radius:12px;background:var(--peach);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb.g{background:var(--raised)}
.thumb svg{width:82%;height:82%}

/* boxes & cards */
.box{border-radius:16px;padding:16px;background:var(--raised)}
.box.pc,.box.low{background:var(--card);border:1px solid var(--line)}
.box.line{background:transparent;border:1px solid var(--line)}
.card{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;text-align:left;color:var(--text);min-width:0}
.card.filled{border-color:var(--line-2)}
.card .cimg{aspect-ratio:16/9;background:var(--peach);display:grid;place-items:center;max-width:100%}
.card .cimg.g{background:var(--raised)}
.card .cimg svg{height:82%}
.card .cimg img{width:100%;height:100%;object-fit:cover}
.card .cb{padding:12px 16px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .ct{font-size:15px;font-weight:600;line-height:1.35}
.card .cs{font-size:13px;color:var(--text-2);line-height:1.5}
.star{color:var(--star)}
.stars{display:flex;gap:4px}
.stars button{color:var(--star);width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.stars button .ms{font-size:32px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--raised);color:var(--text-2);display:grid;place-items:center;font-weight:500;font-size:14px;flex:none}
.tbadge{height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;flex:none;background:var(--raised);color:var(--text-2);white-space:nowrap}
.tbadge.meet{background:var(--accent-soft);color:var(--accent-ink)}
.tbadge.q,.tbadge.dim{background:var(--raised);color:var(--muted)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.divider{height:1px;background:var(--line);border:0;margin:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 16px;color:var(--text-2)}
.empty .ms{font-size:32px;color:var(--muted)}
.empty b{color:var(--text);font-size:15px;font-weight:600}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;margin:0}
.info dt{color:var(--muted);font-size:13px;display:flex;align-items:flex-start;gap:6px;white-space:nowrap;padding-top:2px}
.info dd{margin:0;font-size:14px;line-height:1.55}
.rbar{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.rbar i{height:6px;border-radius:3px;background:var(--raised);overflow:hidden;display:block}
.rbar i b{display:block;height:100%;background:var(--text-2);border-radius:3px}
.qrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.qrow > span{font-size:12px;font-weight:500;color:var(--muted)}

/* nav */
.navbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);height:64px;flex:none}
.navbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:500}
.navbar .ind{width:40px;height:28px;display:grid;place-items:center;position:relative}
.navbar .ind .ms{font-size:22px}
.navbar button[aria-current="page"]{color:var(--text)}
.navbar .dot{position:absolute;top:2px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.topbar{display:flex;align-items:center;gap:4px;height:56px;padding:0 8px;flex:none;background:var(--bg)}
.topbar .title{font-size:17px;font-weight:600;flex:1;min-width:0;padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp{height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.lp i{display:block;height:100%;border-radius:2px;background:var(--accent)}

/* map */
.map{position:relative;background:var(--map-bg);overflow:hidden;cursor:crosshair;touch-action:manipulation}
.map svg.base{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);z-index:4}
.pin .price{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 8px;border-radius:8px;background:var(--card);border:1px solid var(--line-2);box-shadow:0 1px 3px rgb(0 0 0 / .12);font-size:12px}
.pin.out .price{background:var(--raised);color:var(--muted);box-shadow:none}
.pin.edge .price{border-style:dashed}
.pin .chip.sel{box-shadow:0 2px 8px rgb(0 0 0 / .2)}
.bld{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;gap:4px;padding:4px;border-radius:6px}
.bld i{width:12px;height:12px;border-radius:3px;background:var(--map-bld);display:block;flex:none}
.bld.on i{background:var(--text)}
.bld .bl{font-size:11px;font-weight:500;color:var(--text-2);white-space:nowrap;background:var(--card);padding:1px 6px;border-radius:6px}
.upin{position:absolute;transform:translate(-50%,-90%);z-index:3;color:var(--accent)}
.upin .ms{font-size:24px}
.origin-m{position:absolute;transform:translate(-50%,-100%);z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.origin-m .lab{background:var(--ink);color:var(--on-ink);font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;white-space:nowrap}
.origin-m .ms{color:var(--ink);font-size:28px;margin-top:-2px}
.tmp-pin{position:absolute;transform:translate(-50%,-90%);z-index:6;color:var(--accent);pointer-events:none}
.tmp-pin .ms{font-size:32px}
.tmp-card{position:absolute;left:12px;right:12px;top:12px;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px;z-index:7;box-shadow:var(--float);cursor:default}
.map-hint{display:flex;align-items:center;gap:4px;flex-wrap:wrap;position:absolute;left:12px;bottom:36px;z-index:3;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--text-2);pointer-events:none;max-width:calc(100% - 96px)}
.fab{width:48px;height:48px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--line-2);display:grid;place-items:center;box-shadow:var(--float);position:absolute;z-index:6}
.msheet{background:var(--bg);border-radius:20px 20px 0 0;margin-top:-20px;position:relative;z-index:8;padding:8px 16px 24px;border-top:1px solid var(--line)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 12px}
.sel-card{position:absolute;left:12px;right:76px;bottom:12px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--float);display:flex;gap:12px;align-items:center}
.sel-card .mthumb{width:56px;height:56px}
.webwide .sel-card{left:auto;right:84px;width:380px;bottom:24px}

/* sheet / dialog */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:50;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:4px 20px 24px;z-index:51;animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.webwide .sheet{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:min(760px,90%);border-radius:20px;padding:24px 28px;animation:fade .2s var(--ease)}
.webwide .sheet .handle{display:none}
.sheet h3{font-size:18px;font-weight:600;margin:0}
.sheet .grp{font-size:12px;font-weight:500;color:var(--muted);margin:16px 0 8px}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.45;text-align:center;z-index:60;max-width:calc(100% - 32px);width:max-content;max-height:calc(100% - 48px);overflow:hidden;animation:fade .2s var(--ease);pointer-events:none}
.webwide .toast{bottom:32px}
.has-sheet .toast,.webwide .has-sheet .toast{top:24px;bottom:auto}
.webwide .map-hint{bottom:12px}

/* start screen */
.step{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.step-n{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none}
.step-sub{margin-top:-6px}
.step .qrow{grid-template-columns:28px minmax(0,1fr);align-items:start}
.step .qrow > span{color:var(--muted);padding-top:6px}
.need{font-size:12px;font-weight:500;color:var(--muted)}
.live{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--raised);color:var(--text)}
.live .link{color:var(--text-2);padding:2px 4px}
.cta-dock{background:var(--bg);border-top:1px solid var(--line)}
.seg.lang{height:32px}
.seg.lang button{padding:0 10px;font-size:12px;white-space:nowrap}
.pm{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-2);white-space:nowrap}
.pm .ms{font-size:16px}
.pm.kw{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.condbox{border-radius:16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

/* 추천 한 곳: 영수증처럼 이유와 시간을 한 장에 담아요 */
.pick{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;display:flex;flex-direction:column}
.pick-img{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:12px;background:var(--peach);overflow:hidden;padding:0}
.pick-img svg{width:100%;height:100%;display:block}
.pick-flag{position:absolute;left:8px;top:8px;height:24px;padding:0 8px;border-radius:6px;background:rgb(255 255 255 / .92);color:#1C1A17;font-size:12px;font-weight:500;display:inline-flex;align-items:center}
.pick-body{padding:12px 8px 8px;display:flex;flex-direction:column;gap:12px}
.pick-name{font-size:22px;font-weight:600;line-height:1.25;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.why .tri{white-space:normal;align-items:flex-start;line-height:1.45}
.why .tri::before{margin-top:5px}
.ticket{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.ticket .k{font-size:12px;color:var(--muted)}
.ticket .v{display:block;font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.2;color:var(--text);font-variant-numeric:tabular-nums}
.ticket .s{font-size:12px;color:var(--text-2)}
.ticket .v.warn{color:var(--warn)}
.webwide .pick{flex-direction:row;padding:8px;gap:8px}
.webwide .pick-img{width:44%;aspect-ratio:auto;min-height:300px}
.webwide .pick-body{flex:1;padding:16px 16px 12px}
.webwide .pick-name{font-size:28px}
.altrow .why2{color:var(--text-2)}
.cmpbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13px;color:var(--text-2)}
.cmpbar i{height:8px;border-radius:4px;background:var(--raised);display:block;overflow:hidden}
.cmpbar i b{display:block;height:100%;border-radius:4px;background:var(--muted)}
.cmpbar i b.hi{background:var(--accent)}
.cmpbar .mono{color:var(--text);text-align:right}

/* web shell */
.whead{height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;flex:none}
.wtabs{display:flex;height:64px;align-items:stretch}
.wtabs button{padding:0 16px;font-size:14px;font-weight:500;color:var(--muted);position:relative;display:flex;align-items:center}
.wtabs button[aria-current="page"]{color:var(--text)}
.wtabs button[aria-current="page"]::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--text)}
.wtabs .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px}
.whead .search{height:40px;max-width:300px;min-width:180px}
.wrapw{max-width:1280px;margin:0 auto;padding:32px 40px 48px}
.g2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gl2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.sidecol{display:grid;grid-template-columns:360px minmax(0,1fr);gap:32px;align-items:start}
.feedcol{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.wrapw{padding-inline:24px}}

/* 메뉴 사진·양 정보 */
.thumb svg.dish,.card .cimg svg.dish{width:100%;height:100%}
.card .cimg.photo{position:relative}
.gal{position:relative;border-radius:16px;overflow:hidden;flex:none}
.gtrack{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.gtrack::-webkit-scrollbar{display:none}
.gtile{position:relative;flex:0 0 86%;height:100%;border-radius:16px;overflow:hidden;scroll-snap-align:start;background:var(--peach);padding:0;text-align:left}
.gtile:only-child{flex-basis:100%}
.gtile svg,.gtile img{width:100%;height:100%;display:block;object-fit:cover}
.gcap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(transparent,rgb(0 0 0 / .6));color:#fff;display:flex;flex-direction:column;gap:2px;font-size:12px}
.gcap b{font-size:15px;font-weight:500}
.gtag{position:absolute;right:10px;top:10px;height:24px;padding:0 8px;border-radius:6px;background:rgb(0 0 0 / .5);color:#fff;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.gpick{position:absolute;left:12px;top:12px;z-index:2}
.gwgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gwgrid .gtile{aspect-ratio:4/3;height:auto;flex:none}
.lv{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--text-2)}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.lv i.on{background:var(--text-2)}
.lv b{margin-left:4px;font-weight:500}
.gcap .lv{color:#fff}.gcap .lv i{background:rgb(255 255 255 / .35)}.gcap .lv i.on{background:#fff}
.mthumb{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:var(--peach)}
.mthumb svg{width:100%;height:100%;display:block}
.lead.ph{width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--peach)}
.lead.ph svg{width:100%;height:100%;display:block}
.pv{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:var(--peach)}
.pv svg,.pv img{width:100%;height:100%;display:block;object-fit:cover}
.pv .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;background:rgb(0 0 0 / .45);color:#fff;display:grid;place-items:center}
.pv .nav.l{left:10px}.pv .nav.r{right:10px}
.ptable{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.ptable dt{color:var(--muted)}.ptable dd{margin:0}

/* 길찾기 */
.navbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mapapp{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:#fff}
.mapapp.nv{background:#03C75A}.mapapp.kk{background:#FEE500;color:#191919}

/* 같이 먹어요 실시간 연락 */
.bubs{display:flex;flex-direction:column;gap:12px}
.bub-row{display:flex;gap:8px;align-items:flex-end}
.bub-row.me{flex-direction:row-reverse}
.bub-col{display:flex;flex-direction:column;gap:4px;max-width:78%}
.bub-row.me .bub-col{align-items:flex-end}
.bub{padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--raised);font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.bub-row.me .bub{background:var(--ink);color:var(--on-ink);border-radius:14px 14px 4px 14px}
.bub.q{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.bub.sys{background:var(--raised);color:var(--text-2);font-weight:500}
.bub-meta{font-size:11px;color:var(--muted)}
.qchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.qchips::-webkit-scrollbar{display:none}
.qchips .chip{height:30px;font-size:12px}
.who{display:flex;align-items:center;gap:10px;padding:8px 0}
.who + .who{border-top:1px solid var(--line)}
.stchip{height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;background:var(--raised);color:var(--text);white-space:nowrap;flex:none}
.stchip .ms{font-size:14px}
.stchip.here{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.stchip.late{background:color-mix(in srgb,var(--error) 12%,transparent);color:var(--error)}
.soon-bn{border-radius:16px;padding:14px 16px;background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;gap:10px}
.soon-bn .t-xs{color:inherit;opacity:.8}
.soon-bn .btn.tonal{background:rgb(128 128 128 / .2);color:inherit}
.kbtn{background:#FEE500;color:#191919;border:0}
.cd{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--raised);color:var(--text);font-size:12px;font-weight:500;white-space:nowrap}

/* 세부 필터 · 현장 제보 */
.ltag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--text-2);background:var(--raised);border-radius:6px;padding:0 6px;height:20px;white-space:nowrap}
.ltag .ms{font-size:14px}
.ltag.warn{background:color-mix(in srgb,var(--error) 12%,transparent);color:var(--error)}
.ltag.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.lrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.lrow + .lrow{border-top:1px solid var(--line)}
.lrow .lead{width:36px;height:36px}
.feat-row .chip{height:30px;font-size:12px}
.newb{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:500;white-space:nowrap}

/* 오늘의 학식 · 천원의 아침밥 */
.meal-card{border-radius:16px;padding:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.meal-row{display:flex;gap:12px;align-items:center;padding:12px 0;text-align:left;width:100%;color:var(--text);border-radius:10px}
.meal-row + .meal-row{border-top:1px solid var(--line)}
.meal-row .mthumb{width:48px;height:48px}
.meal-row .mn{font-size:15px;font-weight:500;line-height:1.35}
.meal-row .ms2{font-size:12px;color:var(--muted);line-height:1.45}
.cheon{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:500;white-space:nowrap}
.mstat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.mstat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.mstat.on{color:var(--ok)}.mstat.soon{color:var(--warn)}
.dtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dtabs button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.dtabs button b{font-size:15px;font-weight:500;color:var(--text)}
.dtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.dtabs button[aria-pressed="true"] b{color:var(--on-ink)}
.dtabs button .td{font-size:11px;font-weight:500;color:var(--accent-ink)}
.dtabs button[aria-pressed="true"] .td{color:inherit}
.corner{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.corner .items{display:flex;flex-wrap:wrap;gap:6px}
.corner .items span{height:28px;padding:0 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:13px;display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.corner .items span.mi{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-weight:500}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cmp > div{border-radius:12px;background:var(--raised);padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.cmp b{font-size:17px;font-weight:600}
.src-note{font-size:12px;color:var(--muted);line-height:1.5}

/* 결과 보기 방식 — 목록 / 사진 피드 */
.vseg{height:32px}
.vseg button{padding:0 12px;font-size:13px;gap:4px}
.vfeed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.webwide .vfeed{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.webwide .vfeed.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1180px){.webwide .vfeed,.webwide .vfeed.n3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vcard{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;color:var(--text);padding:0;min-width:0}
.vcard.dim{opacity:.62}
.vimg{position:relative;aspect-ratio:1;background:var(--peach);overflow:hidden;display:block}
.vimg svg,.vimg img{width:100%;height:100%;display:block;object-fit:cover}
/* 방문자 사진 느낌: 같은 메뉴 그림도 사람마다 다르게 찍은 것처럼 확대·기울기를 달리해요 */
.snapw{display:block;width:100%;height:100%;overflow:hidden}
.snapw svg{width:100%;height:100%;display:block;transform:scale(var(--z,1.16)) rotate(var(--r,0deg));transform-origin:var(--o,50% 50%)}
.vbadge{position:absolute;left:8px;top:8px;height:22px;padding:0 8px;border-radius:6px;background:rgb(0 0 0 / .5);color:#fff;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.vbadge .ms{font-size:13px}
.vcap{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(transparent,rgb(0 0 0 / .6));color:#fff;display:flex;align-items:flex-end;gap:6px}
.vcap b{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.3}
.vcap span{font-size:12px;font-weight:500;white-space:nowrap}
.vb{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;min-width:0}
.vdesc{font-size:12px;line-height:1.45;color:var(--text);background:var(--raised);border-radius:8px;padding:6px 8px;display:flex;gap:4px}
.vdesc .ms{font-size:14px;color:var(--muted);margin-top:1px}
.vflags{display:flex;gap:4px;flex-wrap:wrap}
.vflag{height:20px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:2px;background:var(--raised);color:var(--text);white-space:nowrap}
.vflag.hot{background:color-mix(in srgb,var(--error) 12%,transparent);color:var(--error)}
.vflag .ms{font-size:12px}
.vrev{font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.vmeta .avatar{width:22px;height:22px;font-size:10px}

/* ================= store: shared (db) with local fallback ================= */
const Store = {
  mode: "local", db: null, uid: null, writable: true, privLocal: true,
  meTimer: null, meChain: Promise.resolve(),
  init(){
    S.me = normalizeMe(lsJSON("mbj5:me", {}));
    S.posts = lsJSON("mbj5:posts", []);
    S.comments = lsJSON("mbj5:comments", []);
    S.live = lsJSON("mbj5:live", []);
    this.uid = uidLocal();
    this.connect();
  },
  async connect(){
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const canWrite = await user.can("data.write");
      this.db = db; this.uid = uid; this.mode = "shared";
      if (canWrite === false) this.writable = false;
      S.posts = []; S.comments = [];
      db.collection("posts").orderBy("createdAt","desc").limit(500).onSnapshot(snap => {
        S.posts = snap.docs.map(d => Object.assign({id:d.id}, d.data())); render();
      }, () => {});
      db.collection("comments").orderBy("createdAt","asc").limit(1000).onSnapshot(snap => {
        S.comments = snap.docs.map(d => Object.assign({id:d.id}, d.data())); render();
      }, () => {});
      S.live = [];
      db.collection("live").orderBy("createdAt","desc").limit(300).onSnapshot(snap => {
        S.live = snap.docs.map(d => Object.assign({id:d.id}, d.data())); render();
      }, () => {});
      try {
        const snap = await db.doc(`data/users/${uid}/state`).get();
        this.privLocal = false;
        if (snap.exists) S.me = normalizeMe(snap.data());
        else this.saveMe();
      } catch(e) { this.privLocal = true; }
      render();
    } catch(e) { /* stay local */ }
  },
  saveMe(){
    lsSet("mbj5:me", JSON.stringify(S.me));
    if (this.mode !== "shared" || this.privLocal) return;
    clearTimeout(this.meTimer);
    this.meTimer = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(S.me));
      this.meChain = this.meChain.then(() => this.db.doc(`data/users/${this.uid}/state`).set(body)).catch(e => {
        if (e && e.code === "invalid_argument") this.privLocal = true;
      });
    }, 400);
  },
  persistLocal(){ if (this.mode === "local") { lsSet("mbj5:posts", JSON.stringify(S.posts)); lsSet("mbj5:comments", JSON.stringify(S.comments)); lsSet("mbj5:live", JSON.stringify(S.live.slice(0, 200))); } },
  async addLive(x){
    x = Object.assign({authorId:this.uid, nick:S.me.nick || "", createdAt:Date.now(), oks:[]}, x);
    if (this.mode === "shared") { try { await this.db.collection("live").add(x); return true; } catch(e){ this.fail(e); return false; } }
    S.live.unshift(Object.assign({id:"lv" + Date.now().toString(36)}, x)); this.persistLocal(); return true;
  },
  async okLive(x){
    const oks = (x.oks || []).includes(this.uid) ? x.oks.filter(u => u !== this.uid) : [...(x.oks || []), this.uid];
    if (x.seed) { x.oks = oks; return true; }
    if (this.mode === "shared") { try { await this.db.doc(`live/${x.id}`).update({oks}); return true; } catch(e){ this.fail(e); return false; } }
    x.oks = oks; this.persistLocal(); return true;
  },
  fail(e){
    const c = e && e.code;
    if (c === "invalid_argument" && this.mode === "shared") { this.writable = false; toast("지금은 볼 수만 있어요. 글을 쓰려면 사이트 공유 권한을 ‘참여 가능’ 이상으로 받아 주세요."); }
    else if (c === "quota_exceeded") toast("저장 공간이 가득 찼어요. 오래된 글을 지운 뒤 다시 시도해 주세요.");
    else toast("저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.");
    render();
  },
  async addPost(p){
    p = Object.assign({authorId:this.uid, nick:S.me.nick, createdAt:Date.now(), likes:[]}, p);
    if (this.mode === "shared") { try { const ref = await this.db.collection("posts").add(p); return ref.id; } catch(e){ this.fail(e); return null; } }
    const id = "p" + Date.now().toString(36);
    S.posts.unshift(Object.assign({id}, p)); this.persistLocal(); return id;
  },
  async updatePost(id, patch){
    if (this.mode === "shared") { try { await this.db.doc(`posts/${id}`).update(patch); return true; } catch(e){ this.fail(e); return false; } }
    const p = S.posts.find(x => x.id === id); if (p) Object.assign(p, patch); this.persistLocal(); return true;
  },
  async deletePost(id){
    const cs = S.comments.filter(c => c.postId === id);
    if (this.mode === "shared") {
      try { await this.db.doc(`posts/${id}`).delete(); for (const c of cs) { try { await this.db.doc(`comments/${c.id}`).delete(); } catch(e){} } return true; }
      catch(e){ this.fail(e); return false; }
    }
    S.posts = S.posts.filter(x => x.id !== id); S.comments = S.comments.filter(c => c.postId !== id); this.persistLocal(); return true;
  },
  async addComment(c){
    c = Object.assign({authorId:this.uid, nick:S.me.nick, createdAt:Date.now()}, c);
    if (this.mode === "shared") { try { await this.db.collection("comments").add(c); return true; } catch(e){ this.fail(e); return false; } }
    S.comments.push(Object.assign({id:"c"+Date.now().toString(36)}, c)); this.persistLocal(); return true;
  },
  async deleteComment(id){
    if (this.mode === "shared") { try { await this.db.doc(`comments/${id}`).delete(); return true; } catch(e){ this.fail(e); return false; } }
    S.comments = S.comments.filter(c => c.id !== id); this.persistLocal(); return true;
  },
};

/* ================= distance & hours ================= */
const origin = () => S.me.origin || DEFAULT_ORIGIN;
const distOf = (r, o = origin()) => Math.round((Math.hypot((r.x-o.x)*MW/100, (r.y-o.y)*MH/100) * DETOUR + (r.ext||0)) / 10) * 10;
const walkOf = (r, o) => Math.max(1, Math.round(distOf(r, o) / WALK_MPM));
const carOf = (r, o) => Math.max(3, Math.round(distOf(r, o) / CAR_MPM) + 2);
const useCar = (r, o) => (DIST[S.me.prefs.walk] && DIST[S.me.prefs.walk].m === "car") || walkOf(r, o) > 20;
/* 이동 시간은 예시 지도 좌표의 직선거리 × 우회 1.25배로 낸 추정치라 늘 ‘약’을 붙여요 */
const tripOf = (r, o) => useCar(r, o) ? carOf(r, o) : walkOf(r, o);
const moveTxt = (r, o) => `${useCar(r, o) ? "차량" : "도보"} 약 ${tripOf(r, o)}분`;
const fmtM = m => `${pad2(Math.floor(m / 60) % 24)}:${pad2(m % 60)}`;
const budgetOK = (r, b = BUDGET[S.me.prefs.budget]) => !b || ((!b.max || r.price <= b.max) && (!b.min || r.price >= b.min));
const distOK = (r, d = DIST[S.me.prefs.walk]) => !d || (d.m === "walk" ? walkOf(r) <= d.n : carOf(r) <= d.n);
function nextOpen(r, now){ for (let i = 1; i <= 7; i++) { const d = (now.getDay()+i) % 7; if (!r.hours.off.includes(d)) return `${i===1?"내일":DAY[d]+"요일"} ${r.hours.open} 오픈`; } return ""; }
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const liveValid = x => { const K = LIVE_KIND[x.k]; if (!K) return false; return K[2] < 0 ? sameDay(x.createdAt, Date.now()) : Date.now() - x.createdAt < K[2] * 60e3; };
const liveAll = () => [...LIVE_SEED, ...S.live].filter(liveValid).sort((a,b) => b.createdAt - a.createdAt);
const liveOf = rid => liveAll().filter(x => x.rid === rid);
const liveClosed = r => liveOf(r.id).find(x => x.k === "early" || x.k === "off");
function liveTag(r){
  const x = liveOf(r.id).find(y => y.k !== "early" && y.k !== "off"); if (!x) return "";
  const K = LIVE_KIND[x.k];
  return `<span class="ltag ${x.k === "none" ? "ok" : x.k === "many" || x.k === "soldout" ? "warn" : ""}">${ic(K[1],"","sm")}${K[3]} · ${ago(x.createdAt)}</span>`;
}
function hoursStatus(r, now = new Date()){
  const lc = liveClosed(r);
  if (lc) return {state:"rclosed", short: lc.k === "off" ? "제보: 오늘 휴무" : "제보: 일찍 마감", label: `${lc.k === "off" ? "제보: 오늘 임시 휴무" : "제보: 재료 소진으로 일찍 마감"} · ${ago(lc.createdAt)}`};
  const H = r.hours, d = now.getDay(), m = now.getHours()*60 + now.getMinutes();
  if (H.off.includes(d)) return {state:"off", short:"오늘 휴무", label:`오늘 휴무 · ${nextOpen(r, now)}`};
  const o = toM(H.open), c = toM(H.close);
  if (m < o) return {state:"before", short:`${H.open} 오픈`, label:`영업 전 · ${H.open} 오픈`};
  if (m >= c) return {state:"closed", short:"영업 종료", label:`영업 종료 · ${nextOpen(r, now)}`};
  if (H.brk && m >= toM(H.brk[0]) && m < toM(H.brk[1])) return {state:"break", short:"브레이크타임", label:`브레이크타임 · ${H.brk[1]} 재개`};
  /* 지금 열려 있어도 도착했을 때 주문이 끝났으면 갈 수 없는 곳이에요. 다음 멈춤(브레이크·마감) 30분 전이 주문 마감 */
  const stop = H.brk && m < toM(H.brk[0]) ? toM(H.brk[0]) : c, last = stop - LAST_ORDER, arrive = m + tripOf(r), left = last - arrive;
  const t = {arrive: fmtM(arrive), last: fmtM(last), left, brk: stop !== c};
  if (left < 0) return Object.assign(t, {state:"late", short:"도착 전 주문 마감", label:`도착 전 주문 마감 · 주문 마감 ${fmtM(last)}, 도착 예상 ${fmtM(arrive)}`});
  if (left <= 30) return Object.assign(t, {state:"soon", ok:true, short:`주문 마감 ${fmtM(last)}`, label:`주문 가능 · ${fmtM(last)} 주문 마감, 도착 후 ${left}분 여유`});
  return Object.assign(t, {state:"open", ok:true, short:"주문 가능", label:`주문 가능 · ${fmtM(last)} 주문 마감${t.brk ? " (브레이크타임 전)" : ""}`});
}
/* ‘지금 갈 수 있다’ = 도착 예상 시각에 주문할 수 있다 */
const isOpen = r => !!hoursStatus(r).ok;
const statusCls = s => s.state === "open" ? "open" : s.state === "soon" ? "soon" : s.state === "rclosed" ? "warn" : "";
function hoursLines(r){
  const H = r.hours, out = [];
  out.push(`${H.off.length ? "영업일" : "매일"} ${H.open}–${H.close}`);
  if (H.brk) out.push(`브레이크타임 ${H.brk[0]}–${H.brk[1]}`);
  out.push(H.off.length ? `${H.off.map(d => DAY[d]).join("·")}요일 휴무` : "휴무일 없음");
  return out;
}

/* 외부 지도앱 길찾기 링크. 카카오맵: 공식 /link/by 형식, 네이버 앱: nmap://route 형식, 네이버 PC 웹: directions 경로(웹메르카토르 좌표) */
function routeURL(app, r, o = origin()){
  const s = toLL(o.x, o.y), t = toLL(r.x, r.y), car = useCar(r, o);
  if (app === "kakao") return `https://map.kakao.com/link/by/${car ? "car" : "walk"}/${nm(o.label)},${s.lat},${s.lng}/${nm(r.name)},${t.lat},${t.lng}`;
  if (app === "naver-app") return `nmap://route/${car ? "car" : "walk"}?slat=${s.lat}&slng=${s.lng}&sname=${nm(o.label)}&dlat=${t.lat}&dlng=${t.lng}&dname=${nm(r.name)}&appname=kr.ac.sch.meogeobojo`;
  const [sx, sy] = merc(s), [tx, ty] = merc(t);
  return `https://map.naver.com/p/directions/${sx},${sy},${nm(o.label)},,/${tx},${ty},${nm(r.name)},,/-/${car ? "car" : "walk"}`;
}
const fullAddr = r => `충남 아산시 신창면 ${r.addr}`;
function navBtns(r, cls = "btn sm outlined"){
  return `<div class="navbtns"><a class="${cls} st" href="${routeURL("naver", r)}" target="_blank" rel="noopener" data-nav="naver"><span class="mapapp nv" aria-hidden="true">N</span>네이버 지도</a><a class="${cls} st" href="${routeURL("kakao", r)}" target="_blank" rel="noopener" data-nav="kakao"><span class="mapapp kk" aria-hidden="true">K</span>카카오맵</a></div>`;
}
/* ================= conditions & ranking ================= */
const mine = p => p.authorId === Store.uid;
const reviewsOf = rid => S.posts.filter(p => p.type === "review" && p.rid === rid);
const visibleReviews = rid => reviewsOf(rid).filter(p => p.public !== false || mine(p));
/* 별점 = 시연용 기존 평가(base) + 앱에서 남긴 리뷰 */
function ratingDist(rid){
  const r = RID[rid], d = r && r.base ? [...r.base.d] : [0,0,0,0,0];
  reviewsOf(rid).forEach(p => { if (p.rating >= 1 && p.rating <= 5) d[5 - p.rating]++; });
  return d;
}
function ratingOf(rid){
  const d = ratingDist(rid), n = d.reduce((a,b) => a+b, 0);
  if (!n) return {avg:0,n:0};
  return {avg: d.reduce((a,c,i) => a + c*(5-i), 0) / n, n};
}
/* 리뷰 키워드: 기존 평가 키워드 + 앱 리뷰에서 고른 키워드를 합산해 많이 나온 순 */
function topKw(rid, k = 3){
  const r = RID[rid], c = Object.assign({}, r && r.base ? r.base.kw : {});
  visibleReviews(rid).forEach(p => (p.tags||[]).forEach(t => c[t] = (c[t]||0) + 1));
  return Object.entries(c).sort((a,b) => b[1]-a[1]).slice(0, k);
}
function fails(r){
  const p = S.me.prefs, f = S.f, out = [];
  if (!budgetOK(r)) out.push("budget");
  if (!distOK(r)) out.push("walk");
  if (f.openNow && !isOpen(r)) out.push("open");
  if (f.cat !== "전체" && r.cat !== f.cat) out.push("cat");
  if (f.tags.some(t => !r.tags.includes(t))) out.push("tag");
  if ((f.feats || []).some(k => !hasFeat(r, k))) out.push("feat");
  return out;
}
/* 먹은 기록 반영은 식당 단위예요. 최근 7일에 간 식당과 많이 먹은 음식 종류는 뒤로, 아직 안 가 본 식당은 앞으로.
   메뉴 단위 기록과 메뉴 후보가 없어서 ‘안 먹어 본 메뉴’를 약속하지 않아요 */
function hist(){
  const now = Date.now(), visits = {}, ever = new Set(), cat7 = {};
  (S.me.logs || []).forEach(l => { const a = (now - new Date(l.date + "T12:00").getTime()) / 864e5; if (l.rid) { ever.add(l.rid); if (a <= 7) visits[l.rid] = (visits[l.rid] || 0) + 1; } if (a <= 7) { const c = logCat(l); cat7[c] = (cat7[c] || 0) + 1; } });
  return {visits, ever, cat7, n: (S.me.logs || []).length};
}
const freshOn = () => S.me.prefs.fresh !== false && (S.me.logs || []).length > 0;
function freshAdj(r, h = hist()){
  if (!freshOn()) return 0;
  let s = 0; const c = h.cat7[r.cat] || 0;
  if (!h.ever.has(r.id)) s += 1.2;
  if (h.visits[r.id]) s -= 2.2 * h.visits[r.id];
  if (c >= 2) s -= 1.2 * (c - 1); else if (!c) s += .5;
  return s;
}
function freshReason(r, h = hist()){
  if (!freshOn() || h.visits[r.id]) return "";
  const c = h.cat7[r.cat] || 0;
  if (!h.ever.has(r.id) && !c) return `아직 안 가 본 식당이에요 · 최근 7일 ${r.cat} 기록 없음`;
  if (!h.ever.has(r.id)) return "아직 안 가 본 식당이에요";
  if (!c) return `최근 7일 ${r.cat} 기록 없음`;
  return "";
}
const isNew = r => freshOn() && !hist().ever.has(r.id);
function heavyCat(){ const e = Object.entries(hist().cat7).sort((a,b) => b[1] - a[1])[0]; return e && e[1] >= 2 ? e : null; }

/* 필요한 조건. test 결과: true 있음 · false 없음(확인됨) · null 확인 안 됨 */
const kwN = (r, k) => (topKw(r.id, 20).find(([x]) => x === k) || [0, 0])[1];
const tagTri = (r, k) => r.tags.includes(k) ? true : r.no.includes(k) ? false : null;
const NEEDS = {
  solo:   {label:"혼자 앉을 자리", test: r => r.tags.includes("일인석") || r.tags.includes("혼밥") ? true : r.no.includes("혼밥") ? false : null,
           why: r => r.tags.includes("일인석") ? "1인석이 있어요" : "혼자 먹기 편한 자리가 있어요"},
  group:  {label:"4명 이상 앉을 자리", test: r => tagTri(r, "단체"), why: () => "4명 이상 앉을 단체석이 있어요"},
  quiet:  {label:"조용한 대화", test: r => r.tags.includes("룸") || r.tags.includes("조용한") ? true : r.no.includes("조용한") ? false : null,
           why: r => r.tags.includes("룸") ? "룸·칸막이가 있어 대화하기 좋아요" : "조용한 분위기라 대화하기 좋아요"},
  fast:   {label:"빠른 식사", test: r => hasFeat(r, "fast") || kwN(r, "빨리 나와요") >= 5 ? true : null,
           why: r => { const n = kwN(r, "빨리 나와요"); return n ? `리뷰 ${n}명이 ‘빨리 나와요’를 골랐어요` : "회전이 빠른 가게예요"; }},
  plenty: {label:"넉넉한 양", test: r => r.tags.includes("든든한") || kwN(r, "양이 많아요") >= 5 ? true : r.tags.includes("가벼운") ? false : null,
           why: r => { const n = kwN(r, "양이 많아요"); return n ? `리뷰 ${n}명이 ‘양이 많아요’를 골랐어요` : "든든한 메뉴가 있어요"; }},
};
const needKeys = (p = S.me.prefs) => [...(p.party === "1" ? ["solo"] : p.party === "4+" ? ["group"] : []), ...p.needs];
const triCls = v => v === true ? "" : v === false ? "n" : "u";
const triWord = v => v === true ? "있음" : v === false ? "없음" : "확인 안 됨";
function score(r){
  const p = S.me.prefs; let s = 0;
  if (p.foods.length && !p.foods.includes("상관없음")) s += p.foods.includes(r.cat) ? 4 : -1;
  p.tastes.forEach(t => { if (t === "가성비") { if (r.price <= 8000) s += 2; } else if (r.tags.includes(t)) s += 2; });
  /* 있으면 더하고, 없다고 확인된 곳만 빼요. 등록 안 된 정보는 감점하지 않아요 */
  needKeys(p).forEach(k => { const v = NEEDS[k].test(r); s += v === true ? 2.5 : v === false ? -2 : 0; });
  const rt = ratingOf(r.id); if (rt.n) s += (rt.avg - 3) * .6;
  s -= distOf(r) / 1500;
  s += freshAdj(r);
  return s;
}
function sortList(l, sort = S.f.sort){
  const by = {rec:(a,b)=>score(b)-score(a), dist:(a,b)=>distOf(a)-distOf(b), price:(a,b)=>a.price-b.price||distOf(a)-distOf(b), rating:(a,b)=>ratingOf(b.id).avg-ratingOf(a.id).avg||score(b)-score(a)}[sort] || ((a,b)=>score(b)-score(a));
  return [...l].sort(by);
}
const filtered = () => R.filter(r => !fails(r).length);
const ranked = () => sortList(filtered());
const picks = () => sortList(filtered(), "rec");

const mealsOn = iso => (MEALS && MEALS.days && MEALS.days[iso]) || null;
const nowM = (now = new Date()) => now.getHours()*60 + now.getMinutes();
function dayWord(iso){ const t = new Date(); const tm = new Date(t); tm.setDate(t.getDate() + 1); if (iso === isoOf(t)) return "오늘"; if (iso === isoOf(tm)) return "내일"; const d = new Date(iso + "T12:00"); return `${d.getMonth()+1}/${d.getDate()}(${DAY[d.getDay()]})`; }
function mealState(cafe, k, iso, now = new Date()){
  const t = cafe.meals[k]; if (!t) return {s:"none", label:"운영 안 함"};
  const today = isoOf(now);
  if (iso < today) return {s:"done", label:"지난 식단"};
  if (iso > today) return {s:"later", label:`${t[0]}–${t[1]}`};
  const m = nowM(now), a = toM(t[0]), b = toM(t[1]);
  if (m < a) return a - m <= 60 ? {s:"before", label:`${a - m}분 뒤 시작`} : {s:"later", label:`${t[0]} 시작`};
  if (m < b) return b - m <= 30 ? {s:"before", label:`곧 마감 · ${t[1]}까지`} : {s:"on", label:`운영 중 · ${t[1]}까지`};
  return {s:"done", label:"오늘 운영 끝"};
}
const cornersOf = (iso, cafeId, k) => { const d = mealsOn(iso); return (d && d[cafeId] && d[cafeId][k]) || []; };
const mealHas = (iso, k) => CAFES.some(c => cornersOf(iso, c.id, k).length);
/* 지금 보여줄 끼니: 오늘 아직 안 끝난 끼니 → 없으면 다음 운영일의 첫 끼니 */
function mealTarget(now = new Date()){
  const iso = isoOf(now), m = nowM(now);
  for (const k of ["b","l","d"]) { const ends = CAFES.map(c => cornersOf(iso, c.id, k).length && c.meals[k] ? toM(c.meals[k][1]) : -1); if (Math.max(...ends) > m) return {iso, k}; }
  const nx = Object.keys((MEALS && MEALS.days) || {}).sort().find(x => x > iso && ["b","l","d"].some(k => mealHas(x, k)));
  return nx ? {iso:nx, k:["b","l","d"].find(k => mealHas(nx, k))} : null;
}
/* 학식 vs 바깥: 학생회관에서 걸어서 15분 안쪽 식당의 대표 메뉴 가격과 비교 */
/* 학식 기준 가격: 그날 점심 코너들의 평균 (천원의 아침밥 제외) */
function mealBase(iso){
  let ps = CAFES.flatMap(c => cornersOf(iso, c.id, "l")).map(x => x.price);
  if (!ps.length) ps = CAFES.flatMap(c => ["b","l","d"].flatMap(k => cornersOf(iso, c.id, k))).map(x => x.price).filter(p => p > CHEON.price);
  return ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length / 100) * 100 : 5000;
}
function mealCompare(price){
  const from = PKEY.union, near = R.filter(r => !r.ext && r.cat !== "카페" && walkOf(r, from) <= 15);
  if (!near.length) return null;
  const avg = Math.round(near.reduce((a, r) => a + r.price, 0) / near.length / 100) * 100;
  return {avg, diff: avg - price, month: Math.max(0, (avg - price) * 20), list: [...near].sort((a,b) => a.price - b.price || walkOf(a, from) - walkOf(b, from)).slice(0, 3), from};
}
const cafeMain = c => c.items[0];

function startLoading(){
  cancelAnimationFrame(loadRAF);
  const t0 = performance.now(), dur = matchMedia("(prefers-reduced-motion: reduce)").matches ? 300 : 1300;
  const tick = now => {
    if (S.screen !== "loading") return;
    const k = Math.min(1, (now - t0) / dur);
    S.params.pct = Math.round(100 * (1 - Math.pow(1 - k, 2)));
    const bar = document.querySelector(".lp i"), lbl = document.getElementById("load-lbl");
    if (bar) bar.style.width = S.params.pct + "%";
    if (lbl) lbl.textContent = tr(`추천 조건 정리 중 · ${S.params.pct}%`);
    if (k < 1) loadRAF = requestAnimationFrame(tick); else setTimeout(() => resetTo("home"), 250);
  };
  loadRAF = requestAnimationFrame(tick);
}

function altWhy(r, p){
  const d = tripOf(p) - tripOf(r);

  return "추천 순서 다음";

/* ================= 사진 피드: 방문자가 올린 음식 사진 + 후기 ================= */
const priceOfMenu = (r, m) => { const x = r.menus.find(a => a[0] === m); return x ? x[1] : r.price; };
const snapStyle = key => { const h = hstr(key); return `--z:${(1.1 + (h % 13) / 100).toFixed(2)};--r:${(h >> 4) % 7 - 3}deg;--o:${35 + (h >> 8) % 30}% ${35 + (h >> 12) % 30}%`; };
function visitorShots(r){
  const real = visibleReviews(r.id).filter(p => p.photos && p.photos.length).sort((a,b) => b.createdAt - a.createdAt)
    .flatMap(p => p.photos.map((src, j) => ({key:`rv-${p.id}-${j}`, rid:r.id, html:`<img src="${esc(src)}" alt="">`, menu:"", price:0, nick:p.nick || "익명", rating:p.rating, body:p.body, at:p.createdAt, likes:(p.likes || []).length, rv:p.id})));
  const seed = (VSEED[r.id] || []).map(([menu, nick, rating, body, days, likes], j) => { const key = `vs-${r.id}-${j}`;
    return {key, rid:r.id, html:`<span class="snapw" style="${snapStyle(key)}">${dishSVG(menu, j + 1)}</span>`, menu, price:priceOfMenu(r, menu), nick, rating, body, at:LIVE_T0 - days*864e5 - (j + 1)*3.1*3600e3, likes, seed:true}; });
  return [...real, ...seed];
}
/* 식당 순서(추천·검색 순)를 지키면서 한 식당 사진이 몰리지 않게 번갈아 섞어요. 검색어와 메뉴가 맞는 사진은 맨 앞으로 */
function feedShots(list, q = ""){
  const per = list.map(visitorShots), out = [];
  for (let i = 0; per.some(a => a[i]); i++) per.forEach(a => { if (a[i]) out.push(a[i]); });
  const ql = q.trim().toLowerCase(); if (!ql) return out;
  const hit = v => !!v.menu && v.menu.toLowerCase().includes(ql);
  return [...out.filter(hit), ...out.filter(v => !hit(v))];
}

function scrActivity(){
  const t = S.ui.actTab;
  const tabs = ["리뷰","질문","내 모집","참여한 모집"];
  const pick = x => x === "리뷰" ? S.posts.filter(p => p.type === "review" && mine(p)) : x === "질문" ? S.posts.filter(p => p.type === "question" && mine(p)) : x === "내 모집" ? S.posts.filter(p => p.type === "meet" && mine(p)) : S.posts.filter(p => p.type === "meet" && isMember(p));
  let l = pick(t);
  if (t === "내 모집" || t === "참여한 모집") { const rank = p => meetState(p) === "past" ? 1 : 0; l = [...l].sort((a,b) => rank(a)-rank(b) || (rank(a) ? meetTime(b)-meetTime(a) : meetTime(a)-meetTime(b))); }
  else l = [...l].sort((a,b) => b.createdAt - a.createdAt);
  const chipsH = `<div class="chips">${tabs.map(x => chip(`${x} ${pick(x).length}`, t === x, "act-tab", `data-t="${x}"`)).join("")}</div>`;
  const emptyMsg = {"리뷰":["아직 쓴 리뷰가 없어요","리뷰 쓰기",`data-act="write-review"`],"질문":["아직 올린 질문이 없어요","질문 남기기",`data-act="compose" data-k="question"`],"내 모집":["아직 만든 모집이 없어요","같이 먹기 모집",`data-act="compose" data-k="meet"`],"참여한 모집":["아직 참여한 모집이 없어요","모집 글 보러 가기",`data-act="go-meets"`]}[t];
  const body = l.length ? `<div class="list">${l.map(p => p.type === "meet" ? meetRow(p) : p.type === "review" ? `<button class="li st" data-act="post" data-id="${p.id}"><span class="lead">${ic("rate_review")}</span><span class="grow col gap4"><span class="tt">${esc(RID[p.rid]?RID[p.rid].name:"식당")} · <span class="star">★${p.rating}</span></span><span class="stt" data-nt>${esc(p.body)}</span></span><span class="t-xs">${ago(p.createdAt)}${p.public===false?"<br>나만 보기":""}</span></button>`
      : `<button class="li st" data-act="post" data-id="${p.id}"><span class="lead">${ic("help")}</span><span class="grow col gap4"><span class="tt" data-nt>${esc(p.title)}</span><span class="stt">댓글 ${pubC(p.id).length} · ${ago(p.createdAt)}</span></span></button>`).join("")}</div>`
    : `<div class="empty">${ic(t==="리뷰"?"rate_review":t==="질문"?"help":"event")}<b>${emptyMsg[0]}</b><button class="btn sm outlined st" ${emptyMsg[2]}>${emptyMsg[1]}</button></div>`;
  const note = (t === "내 모집" || t === "참여한 모집") ? `<span class="t-xs">약속 시간이 1시간 지나면 ‘지난 약속’으로 내려가요. 모집을 누르면 참여자와 약속 이야기를 볼 수 있어요.</span>` : "";
  if (isWeb()) return `${webHeader("my")}<div class="main"><div class="wrapw col gap16" style="max-width:860px"><div class="row"><button class="ibtn st" data-act="back" aria-label="뒤로">${ic("arrow_back")}</button><span class="h2 grow" style="font-size:22px">내 활동</span></div>${chipsH}${note}${body}</div></div>`;
  return `${topbar("내 활동")}<div class="main"><div class="pad col gap12" style="padding-block:4px 24px">${chipsH}${note}${body}</div></div>`;
}

let lastKey = "";
function render(anim){
  const app = document.getElementById("app");
  const scroller = app.querySelector(".main");
  const key = S.screen + JSON.stringify(S.params.rid||"") + S.view;
  const keepScroll = !anim && key === lastKey && scroller ? scroller.scrollTop : 0;
  const sheetEl = app.querySelector(".sheet"), sheetScroll = sheetEl && S.sheet ? sheetEl.scrollTop : 0;
  const active = document.activeElement && document.activeElement.id;
  let caret = null; try { caret = active ? document.activeElement.selectionStart : null; } catch(e){}
  S.wide = window.innerWidth >= 960;
  document.body.classList.toggle("framed", S.view === "app" && window.innerWidth >= 700);
  document.body.classList.toggle("webwide", isWeb());
  document.querySelectorAll('#stage-side [data-act="view"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === S.view)));
  document.querySelectorAll('#side-theme [data-act="theme-set"]').forEach(b => b.setAttribute("aria-pressed", String((b.dataset.v === "dark") === isDark())));
  const fn = {login:scrLogin,prefs:scrPrefs,loading:scrLoading,home:scrHome,map:scrMap,detail:scrDetail,reviews:scrReviews,community:scrCommunity,review:scrReview,saved:scrSaved,my:scrMy,activity:scrActivity,search:scrSearch,records:scrRecords,cafe:scrCafe}[S.screen] || scrHome;
  document.documentElement.lang = S.lang === "zh" ? "zh-CN" : S.lang;
  app.classList.toggle("has-sheet", !!S.sheet);
  app.innerHTML = `<div class="${anim?"screen-in":""}" style="height:100%;display:flex;flex-direction:column">${fn()}</div>${sheetHTML()}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:""}`;
  translateDOM(app); translateDOM(document.getElementById("stage-side"));
  const m = app.querySelector(".main"); if (m && keepScroll) m.scrollTop = keepScroll;
  const sh = app.querySelector(".sheet"); if (sh && sheetScroll) sh.scrollTop = sheetScroll;
  if (active) { const el = document.getElementById(active); if (el && el !== document.body) { el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch(e){} } }
  lastKey = key;
  if (S.screen === "loading" && anim) startLoading();
  if (anim && S.screen === "search") { const q = document.getElementById("q"); if (q) q.focus(); }
}

const newDraft = rid => ({rid: rid || "", rating: 0, body: "", photos: [], tags: [], public: true, editId: ""});
function openReview(rid){

  const fromDraft = !!(S.me.draft && (!rid || S.me.draft.rid === rid));

async function submitReview(){
  const d = S.params.d, err = {};
  if (!d.rid) err.rid = 1; if (!d.rating) err.rating = 1; if (d.body.trim().length < 10) err.body = 1;
  if (Object.keys(err).length) { S.params.err = err; return render(); }
  if (Store.mode === "shared" && !Store.writable) return toast("지금은 글을 볼 수만 있어요.");
  const body = {type:"review", rid:d.rid, rating:d.rating, body:d.body.trim(), photos:d.photos, tags:d.tags, public:d.public};
  const ok = d.editId ? await Store.updatePost(d.editId, body) : await Store.addPost(body);
  if (!ok) return;
  if (!d.editId) { S.me.draft = null; Store.saveMe(); }
  S.sheet = null; back();
  toast(d.editId ? "리뷰를 고쳤어요." : d.public ? "리뷰를 올렸어요. 밥수다에도 보여요." : "리뷰를 저장했어요. 나만 볼 수 있어요.");
}
function resizeImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 520 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.62)); };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });

  if (kind === "login") {
    const nick = val("lg-nick"), email = S.sheet.provider === "email" ? val("lg-email") : "";
    if (S.sheet.provider === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { Object.assign(S.sheet, {err:"이메일 주소를 확인해 주세요. 예: name@sch.ac.kr", nick, email}); return render(); }
    if (nick.length < 2) { Object.assign(S.sheet, {err:"닉네임을 2자 이상 적어 주세요.", nick, email}); return render(); }
    S.me.nick = nick; if (email) S.me.email = email; Store.saveMe();
    S.sheet = null;
    if (S.screen === "login") afterLogin(); else render();
    toast(`${nick}님, 반가워요`);
  }
  if (kind === "nick") { const n = val("nk"); if (n.length < 2) { S.sheet.err = "닉네임을 2자 이상 적어 주세요."; return render(); } S.me.nick = n; Store.saveMe(); S.sheet = null; toast("프로필을 고쳤어요."); }
  if (kind === "pin-name") {
    const n = val("pn"), t = S.ui.tmp;
    if (n.length < 2) { S.sheet.err = "핀 이름을 2자 이상 적어 주세요."; S.sheet.name = n; return render(); }
    if (!t) { S.sheet = null; return render(); }
    const pin = {id: "pin" + Date.now().toString(36), label: n, x: t.x, y: t.y};
    S.me.pins = [...S.me.pins, pin]; S.sheet = null; setOrigin({key:pin.id, label:pin.label, x:pin.x, y:pin.y}, true);
    toast(`‘${n}’ 핀을 저장하고 이 위치 기준으로 정렬했어요.`);
  }
  if (kind === "compose") {
    const s = S.sheet, meet = s.k === "meet";
    Object.assign(s, {title:val("cp-title"), body:val("cp-body"), when:val("cp-when"), place:val("cp-place"), cap:+val("cp-cap") || 4, rid:val("cp-rid"), open:val("cp-open")});
    if (meet && s.open && !OPEN_RE.test(s.open)) { s.err = "오픈채팅 링크는 https://open.kakao.com/ 으로 시작해야 해요."; return render(); }
    if (s.title.length < 2) { s.err = "제목을 2자 이상 적어 주세요."; return render(); }
    if (meet && !s.when) { s.err = "만날 시간을 골라 주세요."; return render(); }
    if (meet && new Date(s.when).getTime() < Date.now() - 5*60e3) { s.err = "지난 시간으로는 모집할 수 없어요."; return render(); }
    if (meet && !s.place) { s.err = "만날 장소를 적어 주세요."; return render(); }
    if (meet && (s.cap < 2 || s.cap > 10)) { s.err = "인원은 2~10명으로 정해 주세요."; return render(); }
    if (s.body.length < 2) { s.err = "내용을 적어 주세요."; return render(); }
    if (Store.mode === "shared" && !Store.writable) { s.err = "지금은 글을 볼 수만 있어요."; return render(); }
    const id = await Store.addPost(meet ? {type:"meet", title:s.title, body:s.body, when:s.when, place:s.place, cap:s.cap, rid:s.rid||"", members:[], closed:false, open:s.open||"", st:{}} : {type:"question", title:s.title, body:s.body});
    if (id) { S.sheet = null; S.ui.comTab = "전체"; S.ui.comSort = "new"; if (S.screen !== "community") resetTo("community"); toast(meet ? "모집을 올렸어요. 내 활동 › 내 모집에서 관리할 수 있어요." : "질문을 올렸어요."); }
  }
  if (kind === "log") {
    const s = S.sheet, mv = val("lg-menu"); Object.assign(s, {name: val("lg-name") || s.name || "", date: val("lg-date") || todayISO(), menu: s.menu && mv === tr(s.menu) ? s.menu : mv, memo: val("lg-memo")});
    const pv = val("lg-price"); s.price = pv === "" ? "" : Math.max(0, +pv || 0);
    if (!s.rid && s.name.length < 1) { s.err = "식당을 고르거나 이름을 적어 주세요."; return render(); }
    const entry = {id: s.id || ("lg" + Date.now().toString(36)), rid: s.rid || "", name: s.rid ? "" : s.name, menu: s.menu, price: s.price === "" ? 0 : s.price, date: s.date, who: s.who || "", rating: s.rating || 0, memo: s.memo, at: s.at || Date.now()};
    S.me.logs = s.id ? S.me.logs.map(x => x.id === s.id ? entry : x) : [entry, ...S.me.logs];
    Store.saveMe(); S.sheet = null; S.ui.recTab = "log";
    toast(s.id ? "기록을 고쳤어요." : "기록했어요. 기록 탭에서 이번 달 식비와 함께 볼 수 있어요.");
  }
  if (kind === "look") {
    const p = S.posts.find(x => x.id === f.dataset.id); if (!p) return; if (needNick("상태를 알리려면 닉네임이 필요해요.")) return;
    const st = Object.assign({}, p.st || {}), prev = st[Store.uid] || {s:"going"}; st[Store.uid] = Object.assign({}, prev, {look:val("look-in"), at:Date.now()});
    if (await Store.updatePost(p.id, {st})) toast("찾기 쉬운 표시를 참여자에게 보여줘요.");
  }
  if (kind === "dm") {
    const body = val("dm-in"), s = S.sheet; if (!body || !s) return; const p = S.posts.find(x => x.id === s.id);
    if (await Store.addComment({postId:s.id, body, dm:dmKey(Store.uid, s.to)})) { render(); demoReply(p, body, dmKey(Store.uid, s.to)); }
  }
  if (kind === "open-link") {
    const v = val("ol-in"), s = S.sheet; if (!OPEN_RE.test(v)) { s.err = "https://open.kakao.com/ 으로 시작하는 링크를 넣어 주세요."; s.v = v; return render(); }
    if (await Store.updatePost(s.id, {open:v})) { openSheet({type:"post", id:s.id}); toast("오픈채팅 링크를 참여자에게 열어 뒀어요."); }
  }
  if (kind === "live") {
    const s = S.sheet; s.memo = val("lv-memo"); if (!s.k) { s.err = "지금 상황을 하나 골라 주세요."; return render(); }
    if (Store.mode === "shared" && !Store.writable) { s.err = "지금은 볼 수만 있어요."; return render(); }
    if (await Store.addLive({rid:s.rid, k:s.k, memo:s.memo})) { S.sheet = null; toast("제보해 줘서 고마워요. 다른 학생들에게 바로 보여요."); }
  }
  if (kind === "comment") {
    const body = val("cm-in"); if (!body) return;
    if (needNick("댓글을 달려면 닉네임이 필요해요.")) return;
    if (await Store.addComment({postId: f.dataset.id, body})) { render(); const p = S.posts.find(x => x.id === f.dataset.id); if (p && p.type === "meet") demoReply(p, body); }
  }
});
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => render(), 120); });
setInterval(() => { const ae = document.activeElement; if (!S.sheet && !(ae && ae.matches && ae.matches("input,textarea,select"))) render(); }, 60e3);

/* ================= boot ================= */
MEALS = buildSampleMeals(); loadMeals();
Store.init();
const h = (location.hash || "").replace("#","");
const savedView = lsGet("mbj5:view");
S.view = h === "web" || h === "app" ? h : savedView || (window.innerWidth >= 1100 ? "web" : "app");
/* 첫 화면 순서: 로그인 → 조건 설정 → 추천(홈). 로그인했거나 ‘로그인 없이 둘러보기’를 고른 뒤엔 건너뜀 */
if (!S.me.nick && !lsGet("mbj5:skipLogin")) S.screen = "login";
else if (!S.me.prefsDone) S.screen = "prefs";
render(true);
})();
</script>

</body></html>
