# Render Blueprint for the Flutter Web app (static site).
# Secrets are set in the Render dashboard (sync: false), never committed.
services:
  - type: web
    runtime: static
    name: meogeobojo-web
    buildCommand: bash scripts/render_build.sh
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.47.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY   # the publishable/anon key ONLY
        sync: false
      - key: KAKAO_JAVASCRIPT_KEY       # web map; register the site domain in Kakao
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # React admin dashboard. Uses the PUBLISHABLE Supabase key only; what an admin
  # may do is enforced by Row Level Security in the database.
  - type: web
    runtime: static
    name: meogeobojo-admin
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY   # publishable key ONLY, never a service-role key
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
